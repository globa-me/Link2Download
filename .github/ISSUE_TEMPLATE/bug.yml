name: Bug report
description: Report a reproducible problem in Link2Download
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS Apple Silicon, macOS Intel, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "For example: 1.4.1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Start…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove cookies, tokens, signed URL parameters, account details and personal file paths before posting.
      render: shell
